<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 19c4-6 20-6 24 0' fill='none' stroke='%235B9BFF' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4 19c4-6 20-6 24 0" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M6 23c4-4 16-4 20 0" fill="none" stroke="var(--signal)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M9 15c3-5 11-5 14 0" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      </svg>
      Nest
    </div>
    <nav class="crumbs" aria-label="Location"><span id="projectName">Harbor</span><span class="sep">/</span><strong id="objectiveTitle">Loading</strong></nav>
    <div class="top-right">
      <span class="chip head" id="headChip">Accepted <b id="headVer">checkpoint -</b></span>
      <span class="chip"><b id="peopleCount">0</b> <span id="peopleNoun">people</span>, <b id="agentCount">0</b> <span id="agentNoun">agents</span></span>
      <span class="chip" id="spendChip" title="Model spend so far, against the cap">Spend <b id="spend">$0.00</b></span>
      <span class="chip live" id="liveChip"><span class="dot"></span><span id="liveText">Connecting</span></span>
      <button class="btn small" id="signInBtn" type="button">Sign in</button>
    </div>
  </header>

  <main class="shell">
    <aside class="panel rail" aria-label="Context">
      <div class="panel-head"><h2>Context</h2><span class="aside">versioned like code</span></div>
      <div class="rail-body">
        <input class="search" id="ctxSearch" type="search" placeholder="Search requirements and decisions" aria-label="Search context" autocomplete="off">
        <div class="store" id="store"></div>
        <div id="ctxGroups"></div>
      </div>
    </aside>

    <section class="panel map-panel" aria-label="Work map">
      <div class="panel-head">
        <h2>Work map</h2>
        <div class="map-tools" id="mapTools"></div>
      </div>
      <div class="tasks" id="tasks" aria-label="Tasks"></div>
      <div class="map-wrap" id="mapWrap">
        <svg id="map" role="img" aria-label="Contributions by task"></svg>
        <div class="tip" id="tip" hidden></div>
        <div class="map-empty" id="mapEmpty" hidden></div>
      </div>
      <div class="legend">
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--text)" stroke-width="1.5"/></svg>Agent contribution</span>
        <span><svg viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="11" height="11" rx="2.5" fill="none" stroke="var(--text)" stroke-width="1.5"/></svg>Person's contribution</span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--neutral)"/></svg>Approved</span>
        <span><svg viewBox="0 0 14 14"><defs><pattern id="lh" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" class="hatch-line"/></pattern></defs><circle cx="7" cy="7" r="5.5" fill="url(#lh)" stroke="var(--text)" stroke-dasharray="2 1.5"/></svg>Relied on old context</span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--ink)"/></svg>Accepted</span>
        <span><svg viewBox="0 0 14 14"><path d="M1 10 C5 2, 9 2, 13 10" fill="none" stroke="var(--signal)" stroke-width="2.4"/></svg>Selected outcome</span>
      </div>
      <div class="panel-head" style="padding-top:4px"><h2>Activity</h2><span class="aside">the Cloudflare service doing the work</span></div>
      <div class="stream" id="stream" aria-live="polite"></div>
    </section>

    <aside class="panel right" aria-label="Decisions">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-inbox" aria-selected="true">Needs you <span class="count zero" id="inboxCount">0</span></button>
        <button class="tab" role="tab" id="tab-outcomes" aria-selected="false">Outcomes <span class="count zero" id="outCount">0</span></button>
        <button class="tab" role="tab" id="tab-inspect" aria-selected="false">Inspector</button>
      </div>
      <div class="right-body" id="rightBody" role="tabpanel"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
